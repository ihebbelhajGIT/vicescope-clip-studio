name: Desktop tests and package smoke

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            architecture: x64
          - runner: macos-15
            architecture: arm64
    runs-on: ${{ matrix.runner }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.architecture }}
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg --no-progress -y
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: |
          brew list --versions ffmpeg-full || brew install ffmpeg-full
          echo "VICESCOPE_FFMPEG_BIN=$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_ENV"
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pytest -q
      - name: Build and smoke test Windows executable
        if: runner.os == 'Windows'
        run: |
          python -m PyInstaller --noconfirm packaging/windows.spec
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & .\dist\ViceScopeClipStudio.exe --smoke-test
          exit $LASTEXITCODE
      - name: Build and smoke test Apple Silicon application
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --noconfirm packaging/macos.spec
          test -d 'dist/ViceScope Clip Studio.app'
          file 'dist/ViceScope Clip Studio.app/Contents/MacOS/ViceScopeClipStudio' | grep arm64
          'dist/ViceScope Clip Studio.app/Contents/MacOS/ViceScopeClipStudio' --smoke-test
